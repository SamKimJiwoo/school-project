<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FBFBFA">
  <title>업스쿨 (UPSCHOOL)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-main: #FBFBFA;        
      --bg-card: #FFFFFF;        
      --wood-dark: #37352F;      
      --wood-primary: #9B6B43;   
      --wood-light: #F1ECE6;     
      --wood-border: #E8E2D8;    
      --text-main: #37352F;      
      --text-muted: #9B9A97;     
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container { max-width: 860px; margin: 0 auto; }

    /* 상단 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--wood-border);
    }

    .logo-area { display: flex; align-items: baseline; gap: 10px; }
    .logo-dot {
      width: 8px; height: 8px;
      background-color: var(--wood-primary);
      border-radius: 50%;
      align-self: center;
    }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--wood-dark); letter-spacing: 0.05em; }
    .logo-sub { font-size: 0.9rem; font-weight: 500; color: var(--wood-primary); }

    .datetime-badge {
      background-color: var(--wood-light);
      color: var(--wood-dark);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      border: 1px solid var(--wood-border);
    }

    /* 날짜 이동 바 (어제, 오늘, 내일) */
    .date-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--wood-border);
      border-radius: 10px;
      padding: 12px 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(55, 53, 47, 0.03);
    }

    .date-nav-btn {
      background-color: var(--wood-light);
      color: var(--wood-dark);
      border: 1px solid var(--wood-border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .date-nav-btn:hover {
      background-color: var(--wood-primary);
      color: #FFF;
      border-color: var(--wood-primary);
    }

    #current-view-date {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--wood-dark);
    }

    /* 학교 검색 & 설정 컨트롤 패널 */
    .control-panel {
      background: var(--bg-card);
      border: 1px solid var(--wood-border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 28px;
      box-shadow: 0 1px 3px rgba(55, 53, 47, 0.04);
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    select, input, button {
      font-family: inherit;
      font-size: 0.92rem;
      border-radius: 6px;
      border: 1px solid var(--wood-border);
      padding: 9px 12px;
      outline: none;
      transition: all 0.2s;
    }

    select, input {
      background-color: #FAFAF8;
      color: var(--text-main);
    }

    select:focus, input:focus {
      border-color: var(--wood-primary);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 2px rgba(155, 107, 67, 0.1);
    }

    #region-select { min-width: 130px; }
    #school-input { flex: 1; min-width: 180px; }
    .class-input { width: 75px; text-align: center; }

    .btn-primary {
      background-color: var(--wood-dark);
      color: #FFFFFF;
      border: none;
      font-weight: 500;
      cursor: pointer;
      padding: 9px 16px;
    }

    .btn-primary:hover { background-color: var(--wood-primary); }

    #search-results {
      margin-top: 12px;
      border-top: 1px solid var(--wood-light);
      padding-top: 10px;
      display: none;
    }

    .result-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .result-item:hover { background-color: var(--wood-light); }
    .result-addr { color: var(--text-muted); font-size: 0.8rem; }

    .selected-school-bar {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--wood-border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .school-title-badge {
      font-weight: 600;
      color: var(--wood-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kind-tag {
      background-color: var(--wood-light);
      color: var(--wood-primary);
      border: 1px solid var(--wood-border);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .class-controls { display: flex; align-items: center; gap: 6px; }

    /* 메인 그리드 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 24px;
      border: 1px solid var(--wood-border);
      box-shadow: 0 1px 3px rgba(55, 53, 47, 0.03);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--wood-light);
    }

    .card h2 { font-size: 1.05rem; font-weight: 600; color: var(--wood-dark); }
    .card-tag { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.08em; }

    ul { list-style: none; }
    li {
      padding: 7px 0;
      font-size: 0.98rem;
      border-bottom: 1px solid #F5F3F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li:last-child { border-bottom: none; }

    .menu-name {
      display: flex;
      align-items: center;
    }
    .menu-name::before {
      content: "";
      display: inline-block;
      width: 5px; height: 5px;
      background-color: var(--wood-primary);
      border-radius: 50%;
      margin-right: 10px;
    }

    /* 알레르기 태그 스타일 */
    .allergy-tag {
      font-size: 0.75rem;
      color: #C07158;
      background-color: #FAF2EE;
      border: 1px solid #F2DCD4;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      white-space: nowrap;
    }

    .period-num {
      display: inline-block;
      background-color: var(--wood-light);
      color: var(--wood-dark);
      border: 1px solid var(--wood-border);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 10px;
      min-width: 50px;
      text-align: center;
    }

    .empty-msg { color: var(--text-muted); font-size: 0.92rem; justify-content: flex-start; }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-area">
        <span class="logo-dot"></span>
        <h1>UPSCHOOL</h1>
        <span class="logo-sub">업스쿨</span>
      </div>
      <!-- 실시간 시계 -->
      <div class="datetime-badge" id="live-clock">로딩 중...</div>
    </header>

    <!-- 날짜 이동 네비게이션 바 -->
    <div class="date-nav-bar">
      <button class="date-nav-btn" onclick="changeDate(-1)">◀ 어제</button>
      <span id="current-view-date">오늘 날짜 로딩 중...</span>
      <button class="date-nav-btn" onclick="changeDate(1)">내일 ▶</button>
    </div>

    <!-- 학교 검색 패널 -->
    <section class="control-panel">
      <div class="search-row">
        <select id="region-select" title="지역(교육청) 선택">
          <option value="">전체 지역</option>
          <option value="B10">서울특별시</option>
          <option value="C10">부산광역시</option>
          <option value="D10">대구광역시</option>
          <option value="E10">인천광역시</option>
          <option value="F10">광주광역시</option>
          <option value="G10">대전광역시</option>
          <option value="H10">울산광역시</option>
          <option value="I10">세종특별자치시</option>
          <option value="J10" selected>경기도</option>
          <option value="K10">강원특별자치도</option>
          <option value="M10">충청북도</option>
          <option value="N10">충청남도</option>
          <option value="P10">전북특별자치도</option>
          <option value="Q10">전라남도</option>
          <option value="R10">경상북도</option>
          <option value="S10">경상남도</option>
          <option value="T10">제주특별자치도</option>
        </select>

        <input type="text" id="school-input" placeholder="학교 이름을 입력하세요 (예: OO중학교)" />
        <button class="btn-primary" onclick="searchSchool()">학교 검색</button>
      </div>

      <div id="search-results"></div>

      <div class="selected-school-bar">
        <div class="school-title-badge">
          <span class="kind-tag" id="school-kind">학교 미선택</span>
          <span id="current-school-name">위에서 학교를 검색해 선택해주세요</span>
        </div>

        <div class="class-controls">
          <input type="number" id="grade-input" class="class-input" min="1" max="6" value="2" title="학년" /> <span>학년</span>
          <input type="number" id="class-input" class="class-input" min="1" max="20" value="1" title="반" /> <span>반</span>
          <button class="btn-primary" onclick="applyClassAndLoad()" style="padding: 7px 12px; font-size: 0.85rem;">조회</button>
        </div>
      </div>
    </section>

    <!-- 급식 & 시간표 카드 -->
    <div class="grid">
      <div class="card">
        <div class="card-header">
          <h2>오늘의 급식</h2>
          <span class="card-tag">LUNCH</span>
        </div>
        <ul id="meal-list">
          <li class="empty-msg">학교를 선택하면 급식이 표시됩니다.</li>
        </ul>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>오늘의 시간표</h2>
          <span class="card-tag">TIMETABLE</span>
        </div>
        <ul id="timetable-list">
          <li class="empty-msg">학교와 학년/반을 선택하면 시간표가 표시됩니다.</li>
        </ul>
      </div>
    </div>

    <footer>
      업스쿨 (UPSCHOOL)
    </footer>
  </div>

  <script>
    const API_KEY = "f509b4f4a72d4e798e96fe1b588fa50b";

    let selectedSchool = {
      eduCode: "",
      schoolCode: "",
      schoolName: "",
      schoolKind: ""
    };

    // 현재 조회 중인 날짜 객체 (기본값: 오늘)
    let viewingDate = new Date();

    // 알레르기 번호 매핑 사전
    const allergyMap = {
      "1": "난류", "2": "우유", "3": "메밀", "4": "땅콩", "5": "대두",
      "6": "밀", "7": "고등어", "8": "게", "9": "새우", "10": "돼지고기",
      "11": "복숭아", "12": "토마토", "13": "아황산류", "14": "호두",
      "15": "닭고기", "16": "쇠고기", "17": "오징어", "18": "조개류"
    };

    // 실시간 시계 (상단 우측)
    function updateLiveClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('live-clock').innerText = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    // 날짜 네비게이션바 갱신 및 데이터 로드
    function updateDateView() {
      const year = viewingDate.getFullYear();
      const month = String(viewingDate.getMonth() + 1).padStart(2, '0');
      const day = String(viewingDate.getDate()).padStart(2, '0');
      const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
      const dayName = weekDays[viewingDate.getDay()];

      document.getElementById('current-view-date').innerText = `${year}.${month}.${day} (${dayName})`;

      if (selectedSchool.schoolCode) {
        fetchMeal();
        const grade = document.getElementById('grade-input').value;
        const classNm = document.getElementById('class-input').value;
        fetchTimetable(grade, classNm);
      }
    }

    // 어제(-1) / 내일(+1) 이동 버튼 핸들러
    function changeDate(days) {
      viewingDate.setDate(viewingDate.getDate() + days);
      updateDateView();
    }

    // YYYYMMDD 문자열 생성 헬퍼
    function getFormattedYMD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    }

    document.getElementById('school-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchSchool();
    });

    // 1. 학교 검색
    async function searchSchool() {
      const region = document.getElementById('region-select').value;
      const keyword = document.getElementById('school-input').value.trim();
      const resultsBox = document.getElementById('search-results');

      if (!keyword) {
        alert("검색할 학교 이름을 입력해주세요!");
        return;
      }

      resultsBox.style.display = "block";
      resultsBox.innerHTML = `<div class="empty-msg" style="padding: 6px;">학교를 검색하는 중...</div>`;

      let url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${API_KEY}&Type=json&SCHUL_NM=${encodeURIComponent(keyword)}`;
      if (region) url += `&ATPT_OFCDC_SC_CODE=${region}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.schoolInfo) {
          const schools = data.schoolInfo[1].row;
          resultsBox.innerHTML = schools.map(s => `
            <div class="result-item" onclick="selectSchool('${s.ATPT_OFCDC_SC_CODE}', '${s.SD_SCHUL_CODE}', '${s.SCHUL_NM}', '${s.SCHUL_KND_SC_NM}')">
              <div>
                <strong>${s.SCHUL_NM}</strong>
                <span class="result-addr">(${s.ORG_RDNMA || s.ATPT_OFCDC_SC_CODE})</span>
              </div>
              <span style="color: var(--wood-primary); font-weight: 500; font-size: 0.85rem;">선택 ›</span>
            </div>
          `).join('');
        } else {
          resultsBox.innerHTML = `<div class="empty-msg" style="padding: 6px;">검색 결과가 없습니다.</div>`;
        }
      } catch (err) {
        resultsBox.innerHTML = `<div class="empty-msg" style="padding: 6px;">검색 중 오류가 발생했습니다.</div>`;
      }
    }

    function selectSchool(eduCode, schoolCode, schoolName, schoolKind) {
      selectedSchool = { eduCode, schoolCode, schoolName, schoolKind };
      document.getElementById('search-results').style.display = "none";
      updateSchoolUI();
      saveAndLoad();
    }

    function updateSchoolUI() {
      document.getElementById('school-kind').innerText = selectedSchool.schoolKind || "학교";
      document.getElementById('current-school-name').innerText = selectedSchool.schoolName;
    }

    function applyClassAndLoad() {
      if (!selectedSchool.schoolCode) {
        alert("먼저 위에서 학교를 검색해서 선택해주세요!");
        return;
      }
      saveAndLoad();
    }

    function saveAndLoad() {
      const grade = document.getElementById('grade-input').value;
      const classNm = document.getElementById('class-input').value;

      localStorage.setItem('upschool_config', JSON.stringify({
        ...selectedSchool,
        grade,
        classNm
      }));

      updateDateView();
    }

    // 2. 급식 조회 + 알레르기 파싱
    async function fetchMeal() {
      const { eduCode, schoolCode } = selectedSchool;
      const YMD = getFormattedYMD(viewingDate);
      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${eduCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${YMD}`;
      const mealEl = document.getElementById('meal-list');
      mealEl.innerHTML = `<li class="empty-msg">급식을 불러오는 중...</li>`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.mealServiceDietInfo) {
          const rawMenu = data.mealServiceDietInfo[1].row[0].DDISH_NM;
          
          // <br/> 기준으로 메뉴별 분리 후 알레르기 번호 추출 및 정제
          const menuLines = rawMenu.split('<br/>');
          mealEl.innerHTML = menuLines.map(line => {
            // 알레르기 번호 추출 (예: "현미밥(1.5.)" -> 메뉴명과 번호 분리)
            const match = line.match(/^([^(]+)(?:\(([^)]+)\))?/);
            if (!match) return `<li><span class="menu-name">${line}</span></li>`;

            const menuName = match[1].trim();
            const allergyNumsStr = match[2]; // "1.5." 등

            let allergyBadgeHtml = "";
            if (allergyNumsStr) {
              // 점(.)으로 분리하여 숫자 추출
              const nums = allergyNumsStr.replace(/\.$/, '').split('.');
              const allergyNames = nums.map(n => allergyMap[n]).filter(Boolean);
              if (allergyNames.length > 0) {
                allergyBadgeHtml = `<span class="allergy-tag">${allergyNames.join(', ')}</span>`;
              }
            }

            return `
              <li>
                <span class="menu-name">${menuName}</span>
                ${allergyBadgeHtml}
              </li>
            `;
          }).join('');
        } else {
          mealEl.innerHTML = `<li class="empty-msg">해당 날짜에 급식 정보가 없습니다.</li>`;
        }
      } catch (err) {
        mealEl.innerHTML = `<li class="empty-msg">급식 정보를 불러오지 못했습니다.</li>`;
      }
    }

    // 3. 시간표 조회
    async function fetchTimetable(grade, classNm) {
      const { eduCode, schoolCode, schoolKind } = selectedSchool;
      const YMD = getFormattedYMD(viewingDate);
      const timeEl = document.getElementById('timetable-list');
      timeEl.innerHTML = `<li class="empty-msg">시간표를 불러오는 중...</li>`;

      let endpoint = "misTimetable";
      if (schoolKind.includes("초등")) endpoint = "elsTimetable";
      else if (schoolKind.includes("고등")) endpoint = "hisTimetable";

      const url = `https://open.neis.go.kr/hub/${endpoint}?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${eduCode}&SD_SCHUL_CODE=${schoolCode}&ALL_TI_YMD=${YMD}&GRADE=${grade}&CLASS_NM=${classNm}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data[endpoint]) {
          const rows = data[endpoint][1].row;
          timeEl.innerHTML = rows.map(r => `<li><div><span class="period-num">${r.PERIO}교시</span> ${r.ITRT_CNTNT}</div></li>`).join('');
        } else {
          timeEl.innerHTML = `<li class="empty-msg">해당 날짜에 등록된 시간표가 없습니다.</li>`;
        }
      } catch (err) {
        timeEl.innerHTML = `<li class="empty-msg">시간표를 불러오지 못했습니다.</li>`;
      }
    }

    // 초기 실행 시 저장된 설정 불러오기
    window.addEventListener('DOMContentLoaded', () => {
      updateDateView(); // 오늘 날짜 텍스트 세팅

      const saved = localStorage.getItem('upschool_config');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.schoolCode) {
          selectedSchool = {
            eduCode: parsed.eduCode,
            schoolCode: parsed.schoolCode,
            schoolName: parsed.schoolName,
            schoolKind: parsed.schoolKind
          };
          document.getElementById('region-select').value = parsed.eduCode;
          document.getElementById('grade-input').value = parsed.grade || 2;
          document.getElementById('class-input').value = parsed.classNm || 1;
          updateSchoolUI();
          updateDateView();
        }
      }
    });
  </script>
</body>
</html>
